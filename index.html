<!DOCTYPE html>
<html>
<head>
  <title>FluxKit</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    /* ANIMATED BACKGROUND */
    .bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #330000, #000000);
      animation: pulse 6s infinite alternate;
      z-index: -1;
    }

    @keyframes pulse {
      0% { filter: brightness(0.8); }
      100% { filter: brightness(1.2); }
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 20px;
      background: rgba(26,0,0,0.9);
      box-shadow: 0 0 25px #660000;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-item {
      color: #ff4d4d;
      font-size: 22px;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .nav-item:hover {
      background: #660000;
      color: #fff;
      box-shadow: 0 0 15px #ff3333;
    }

    .active {
      background: #990000;
      color: #fff;
      box-shadow: 0 0 20px #ff1a1a;
    }

    /* TITLE */
    .title {
      text-align: center;
      font-size: 80px;
      margin-top: 70px;
      color: #ff3333;
      text-shadow: 0 0 30px #ff1a1a;
      animation: glowTitle 3s infinite alternate;
    }

    @keyframes glowTitle {
      0% { text-shadow: 0 0 20px #ff1a1a; }
      100% { text-shadow: 0 0 40px #ff4d4d; }
    }

    /* SECTIONS */
    .section {
      display: none;
      padding: 60px 20px;
      text-align: center;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section h2 {
      font-size: 45px;
      color: #ff4d4d;
      text-shadow: 0 0 15px #ff1a1a;
      margin-bottom: 20px;
    }

    .section p {
      font-size: 24px;
      color: #ff9999;
      margin: 10px 0;
    }

    /* DOWNLOAD BUTTON */
    .btn {
      display: inline-block;
      padding: 18px 50px;
      background: #990000;
      border-radius: 12px;
      color: white;
      font-size: 24px;
      text-decoration: none;
      box-shadow: 0 0 25px #ff1a1a;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ff1a1a;
      box-shadow: 0 0 35px #ff3333;
    }

    /* GIF / IMAGE BOXES */
    .gif-box {
      width: 70%;
      height: 250px;
      margin: 30px auto;
      background: #1a0000;
      border: 2px solid #660000;
      border-radius: 12px;
      box-shadow: 0 0 20px #660000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      color: #ff4d4d;
    }
  </style>
